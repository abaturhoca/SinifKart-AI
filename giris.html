const form = document.querySelector('form');
const decode = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true;
  const error = document.getElementById('error');
  error.textContent = '';
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(form.password.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(bundle.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    const clear = await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(bundle.iv)},key,decode(bundle.data));
    const html = await new Response(new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  } catch (e) { error.textContent = e.name === 'OperationError' ? 'Şifre hatalı.' : 'Panel açılamadı. Güncel bir tarayıcı kullanın.'; button.disabled = false; }
});</script></html>
