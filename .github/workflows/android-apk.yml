name: Android debug APK
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Debug APK derle
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: APK oluşturulduğunu denetle
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Özel depoda önizleme sürümü oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v41-preview-${GITHUB_RUN_NUMBER}" \
            "android/app/build/outputs/apk/debug/app-debug.apk#SinifKart-v41-debug.apk" \
            --target "$GITHUB_SHA" --title "SınıfKart v41 önizleme ${GITHUB_RUN_NUMBER}" \
            --prerelease --notes "Test amaçlı Android debug APK. Gerçek cihaz ve kamera kabulü yapılmadı."
